# BANZAI UI release: public source -> deterministic build -> the complete package -> GitHub Release -> CurseForge.
#
#   push of a tag banzai-X.Y.Z   builds, tests, packages, checks the package against the checksum committed with
#                                the release notes, publishes the GitHub Release, then uploads the same package
#                                to CurseForge (project 1793334)
#   Run workflow (manual)        the same build, tests, package and checksum check, and a publish DRY RUN:
#                                nothing is released or uploaded
#
# GitHub is independent of CurseForge: a valid tag always gets its GitHub Release. CurseForge is tried afterwards;
# if it fails the job fails and says why, and the GitHub Release stays. Re-running the failed job retries
# CurseForge only (the existing release is checked against the rebuilt package, never replaced).
#
# One package serves World of Warcraft Retail and WoW Forever (the TOCs' `## Interface: 120105, 16001`).
# WowUp reads the GitHub Release asset BANZAI-UI-<version>.zip (and CurseForge); no separate package is made.
# Secret used: CF_API_KEY (never printed). No other private input: the two upstream references the build reads
# are public repositories fetched at pinned commits.
name: Release

on:
  push:
    tags:
      - 'banzai-[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/banzai-') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the locked tools
        run: npm ci

      - name: Fetch the pinned upstream references
        run: node tools/fetch-references.js

      - name: Build
        run: npm run build

      - name: Test (Retail and WoW Forever suites)
        run: npm test

      - name: Forever / package contracts
        run: node tools/forevercheck.js

      - name: Package
        run: node tools/release.js

      - name: The package is the reviewed one
        run: |
          version="$(sed -n 's/^## Version: *//p' dist/BushidoPrivateRestore/BushidoPrivateRestore.toc | tr -d '\r')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$PUBLISH" = "true" ] && [ "banzai-$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the built version $version"; exit 1
          fi
          expected="release-notes/BANZAI-UI-$version.sha256"
          if [ ! -f "$expected" ]; then echo "no reviewed checksum committed for $version ($expected)"; exit 1; fi
          want="$(cut -d' ' -f1 "$expected")"
          got="$(cut -d' ' -f1 "release/BANZAI-UI-$version.zip.sha256")"
          echo "reviewed $want"; echo "built    $got"
          [ "$want" = "$got" ] || { echo "the built package is not the reviewed package"; exit 1; }

      # What would be sent, checked offline (the package is the audited one, the notes exist). No secret here.
      - name: Publish plan (nothing is uploaded)
        run: node tools/publish.js --dry-run

      # Advisory only: a CurseForge problem is reported here and never stops the GitHub Release below.
      - name: CurseForge preflight (advisory, nothing is uploaded)
        continue-on-error: true
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "::warning::repository secret CF_API_KEY is not set - the CurseForge upload will fail (the GitHub Release does not depend on it)"
            exit 0
          fi
          node tools/publish.js --dry-run || { echo "::warning::CurseForge preflight failed - the GitHub Release does not depend on it"; exit 1; }

      - name: Keep the package (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BANZAI-UI-${{ env.VERSION }}-dry-run
          path: |
            release/BANZAI-UI-${{ env.VERSION }}.zip
            release/BANZAI-UI-${{ env.VERSION }}.zip.sha256
            release/release.json

      - name: GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # a re-run after a CurseForge failure: the published package must be this one, and is left as it is
            mkdir -p published
            gh release download "$GITHUB_REF_NAME" --pattern "BANZAI-UI-$VERSION.zip" --dir published
            have="$(sha256sum "published/BANZAI-UI-$VERSION.zip" | cut -d' ' -f1)"
            built="$(sha256sum "release/BANZAI-UI-$VERSION.zip" | cut -d' ' -f1)"
            if [ "$have" != "$built" ]; then
              echo "a release for $GITHUB_REF_NAME already exists with a different package - nothing is replaced"; exit 1
            fi
            echo "the release for $GITHUB_REF_NAME already exists with this package ($have) - left as it is"
          else
            gh release create "$GITHUB_REF_NAME" \
              "release/BANZAI-UI-$VERSION.zip" "release/BANZAI-UI-$VERSION.zip.sha256" release/release.json \
              --title "BANZAI UI $VERSION" --notes-file "release-notes/BANZAI-UI-$VERSION.md" --verify-tag --latest
          fi

      # After the GitHub Release, never before it. A failure here fails the job and leaves the release published.
      - name: CurseForge
        if: env.PUBLISH == 'true'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: node tools/publish.js curseforge
